<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Train Map - Transperth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #222;
            padding: 0;
            color: #fff;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: #000;
            border-bottom: 4px solid #fff;
            padding: 24px 30px;
            margin-bottom: 0;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .line-name {
            font-size: 1em;
            color: #fff;
            font-weight: 700;
        }

        .timestamp {
            font-size: 0.85em;
            color: #ccc;
            font-weight: 500;
        }

        .map-container {
            background: #f4f4f4;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            padding: 40px;
            overflow: auto;
            position: relative;
        }

        #network-map {
            width: 100%;
            height: auto;
            min-height: 600px;
        }

        .train-marker {
            cursor: pointer;
            transition: opacity 1s ease-in-out;
        }

        .train-car {
            transition: all 1s linear;
        }

        @keyframes delayPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .train-marker.delayed {
            animation: delayPulse 2s ease-in-out infinite;
        }

        .train-warning {
            filter: drop-shadow(0 0 0.5px rgba(0, 0, 0, 0.8));
        }

        .train-info-popup {
            position: absolute;
            background: #000;
            border: 4px solid #fff;
            padding: 12px 14px;
            font-size: 0.85em;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }

        .train-info-popup .time {
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
        }

        .train-info-popup .dest {
            color: #FCCC0A;
            margin-top: 4px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .train-info-popup .details {
            color: #ccc;
            font-size: 0.85em;
            margin-top: 4px;
            font-weight: 700;
        }

        .status-badge {
            margin-top: 8px;
            padding: 6px 10px;
            font-weight: 900;
            font-size: 0.75em;
            letter-spacing: 1px;
            text-align: center;
            border: 3px solid;
        }

        .delayed-badge {
            background: #FCCC0A;
            color: #000;
            border-color: #000;
        }

        .cancelled-badge {
            background: #EE352E;
            color: #fff;
            border-color: #fff;
        }

        /* Station popup */
        .station-info-popup {
            position: absolute;
            background: #000;
            border: 4px solid #fff;
            padding: 12px 14px;
            z-index: 1001;
            display: none;
            pointer-events: none;
            min-width: 300px;
            max-width: 400px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
        }

        .station-popup-header {
            font-size: 1.1em;
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 2px solid #fff;
            padding-bottom: 8px;
            margin-bottom: 10px;
            color: #fff;
        }

        .station-train-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
            margin-bottom: 6px;
            background: #111;
            border-left: 4px solid var(--line-color);
        }

        .station-train-time {
            font-weight: 700;
            font-size: 0.95em;
            color: #fff;
        }

        .station-train-countdown {
            color: #FCCC0A;
            font-size: 0.85em;
            font-weight: 700;
        }

        .station-train-dest {
            color: #ccc;
            font-size: 0.85em;
        }

        .station-train-platform {
            color: #999;
            font-size: 0.8em;
        }

        .station-no-trains {
            color: #999;
            font-size: 0.9em;
            font-style: italic;
            padding: 10px 0;
        }

        .legend {
            background: #000;
            border-top: 4px solid #fff;
            padding: 24px 30px;
            margin-top: 0;
        }

        .legend-title {
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1em;
        }

        .legend-items {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
            color: #fff;
            font-weight: 700;
        }

        .legend-line {
            width: 32px;
            height: 4px;
        }

        .legend-rect {
            width: 22px;
            height: 10px;
            border: 2px solid #fff;
        }

        .debug-menu {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 4px solid #fff;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
            z-index: 2000;
            min-width: 300px;
            display: none;
        }

        .debug-menu.active {
            display: block;
        }

        .debug-menu h3 {
            margin-bottom: 15px;
            font-size: 1em;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .debug-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .debug-control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .debug-control-group label {
            font-size: 0.8em;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .debug-control-group input[type="time"] {
            padding: 8px;
            border: 2px solid #fff;
            background: #000;
            color: #fff;
            font-size: 1em;
            font-weight: 700;
        }

        .debug-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .debug-btn {
            padding: 10px 16px;
            background: #fff;
            color: #000;
            border: 3px solid #fff;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .debug-btn:hover {
            background: #000;
            color: #fff;
        }

        .debug-btn.secondary {
            background: #000;
            color: #fff;
        }

        .debug-btn.secondary:hover {
            background: #fff;
            color: #000;
        }

        .debug-time-display {
            font-size: 1.3em;
            font-weight: 900;
            color: #fff;
            text-align: center;
            padding: 12px;
            background: #EE352E;
            border: 3px solid #fff;
        }

        .debug-status {
            font-size: 0.85em;
            color: #FCCC0A;
            font-weight: 700;
            text-transform: uppercase;
        }

        .debug-range {
            font-size: 0.85em;
            color: #fff;
            background: #333;
            padding: 8px;
            border: 2px solid #fff;
            margin-top: 5px;
            font-weight: 700;
        }

        .debug-error {
            font-size: 0.85em;
            color: #000;
            background: #FCCC0A;
            padding: 8px;
            border: 3px solid #FCCC0A;
            margin-top: 5px;
            display: none;
            font-weight: 900;
        }

        .debug-error.show {
            display: block;
        }

        .favorite-station {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #000;
            border: 4px solid #fff;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
            min-width: 280px;
            max-width: 350px;
        }

        .favorite-station h4 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .favorite-station-name {
            font-size: 0.85em;
            color: #fff;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fff;
            font-weight: 700;
        }

        .favorite-change {
            font-size: 0.7em;
            color: #FCCC0A;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
        }

        .favorite-change:hover {
            color: #fff;
        }

        .favorite-trains {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .favorite-train {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #fff;
            border: 3px solid #fff;
            border-left: 6px solid #EE352E;
        }

        .favorite-train-info {
            flex: 1;
        }

        .favorite-train-time {
            font-size: 1.1em;
            font-weight: 900;
            color: #000;
        }

        .favorite-train-dest {
            font-size: 0.75em;
            color: #000;
            margin-top: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .favorite-train-countdown {
            font-size: 0.85em;
            font-weight: 900;
            color: #000;
            text-align: right;
            white-space: nowrap;
        }

        .favorite-train-countdown.departing {
            color: #EE352E;
        }

        .favorite-train-countdown.soon {
            color: #FCCC0A;
        }

        .favorite-setup {
            text-align: center;
        }

        .favorite-setup select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 3px solid #fff;
            background: #000;
            color: #fff;
            font-size: 0.85em;
            font-weight: 700;
        }

        .favorite-setup select optgroup {
            background: #222;
            color: #FCCC0A;
            font-weight: 900;
            font-size: 1em;
            padding: 8px 0;
        }

        .favorite-setup select option {
            background: #000;
            color: #fff;
            padding: 8px;
            font-weight: 700;
        }

        .favorite-setup button {
            padding: 10px 20px;
            background: #fff;
            color: #000;
            border: 3px solid #fff;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .favorite-setup button:hover {
            background: #000;
            color: #fff;
        }

        .favorite-no-trains {
            text-align: center;
            color: #fff;
            font-size: 0.85em;
            padding: 10px;
            font-weight: 700;
        }

        .stats-panel {
            background: #000;
            border-top: 4px solid #fff;
            border-bottom: 4px solid #fff;
            padding: 24px 30px;
            margin-bottom: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: #fff;
            border: 3px solid #000;
            padding: 20px;
            color: #000;
            transition: transform 0.1s ease;
            position: relative;
        }

        .stat-card:hover {
            transform: scale(1.02);
        }

        .stat-card.trains {
            background: #EE352E;
            color: #fff;
            border-color: #EE352E;
        }

        .stat-card.lines {
            background: #00933C;
            color: #fff;
            border-color: #00933C;
        }

        .stat-card.on-time {
            background: #0039A6;
            color: #fff;
            border-color: #0039A6;
        }

        .stat-card.delayed {
            background: #FCCC0A;
            color: #000;
            border-color: #FCCC0A;
        }

        .stat-label {
            font-size: 0.75em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 3em;
            font-weight: 900;
            margin-top: 8px;
            line-height: 1;
        }

        .stat-subtext {
            font-size: 0.7em;
            font-weight: 700;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-panel {
            background: #000;
            border-top: 4px solid #fff;
            border-bottom: 4px solid #fff;
            padding: 24px 30px;
            margin-bottom: 0;
        }

        .filter-title {
            font-weight: 900;
            margin-bottom: 15px;
            color: #fff;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 3px solid var(--line-color, #fff);
            border-radius: 50px;
            background: #000;
            cursor: pointer;
            font-size: 0.85em;
            color: #fff;
            transition: all 0.1s ease;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover {
            background: var(--line-color, #fff);
            color: #000;
        }

        .filter-btn.active {
            background: var(--line-color, #fff);
            border-color: var(--line-color, #fff);
            color: #000;
        }

        .filter-btn.all {
            --line-color: #fff;
            background: #fff;
            border-color: #fff;
            color: #000;
        }

        .filter-btn.all:hover {
            background: #000;
            color: #fff;
        }

        .filter-btn.all.active {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Live Train Map</h1>
            <div class="info-bar">
                <div class="line-name" id="lineName">Transperth Network</div>
                <div class="timestamp" id="timestamp">Loading...</div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-card trains">
                    <div class="stat-label">Active Trains</div>
                    <div class="stat-value" id="totalTrains">0</div>
                    <div class="stat-subtext">Currently in service</div>
                </div>
                <div class="stat-card lines">
                    <div class="stat-label">Active Lines</div>
                    <div class="stat-value" id="activeLines">0</div>
                    <div class="stat-subtext">Lines with trains</div>
                </div>
                <div class="stat-card on-time">
                    <div class="stat-label">On Time</div>
                    <div class="stat-value" id="onTimeTrains">0</div>
                    <div class="stat-subtext">Running on schedule</div>
                </div>
                <div class="stat-card delayed">
                    <div class="stat-label">Delayed</div>
                    <div class="stat-value" id="delayedTrains">0</div>
                    <div class="stat-subtext">Behind schedule</div>
                </div>
            </div>
        </div>

        <div class="filter-panel">
            <div class="filter-title">Filter by Line</div>
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn all active" data-line="all">All Lines</button>
            </div>
        </div>

        <div class="map-container">
            <div class="favorite-station" id="favoriteStation">
                <div id="favoriteContent"></div>
            </div>
            <svg id="network-map" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <style>
                    text {
                        font: 1px Helvetica;
                        font-weight: 600;
                        white-space: pre;
                        dominant-baseline: central;
                    }

                    line {
                        stroke-width: 1;
                        fill: none;
                        stroke-linecap: round;
                        stroke-linejoin: round;
                        opacity: 0.4;
                    }

                    .c0 {
                        stroke: #669c35
                    }

                    .c1 {
                        stroke: #1eafa3
                    }

                    .c2 {
                        stroke: #000000
                    }

                    .c3 {
                        stroke: #0042aa
                    }

                    .c4 {
                        stroke: #b5396b
                    }

                    .c5 {
                        stroke: #e3711c
                    }

                    .c6 {
                        stroke: #fdad00
                    }

                    .c7 {
                        stroke: #aaaaaa
                    }

                    .c8 {
                        stroke: #e32400
                    }

                    .c9 {
                        stroke: #e392fe
                    }

                    .w1 {
                        stroke-width: 1;
                    }
                </style>
                <defs>
                    <g id="wm-xf">
                        <circle r="1.2" fill="#000" />
                        <circle r="0.9" fill="#fff" />
                        <circle r="0.6" fill="#000" />
                        <circle r="0.3" fill="#fff" />
                    </g>
                    <g id="wm">
                        <circle r="0.6" fill="#000" />
                        <circle r="0.3" fill="#fff" />
                    </g>
                </defs>

                <!-- Network lines -->
                <line class="c0 " x1="84" y1="38" x2="94" y2="38" />
                <line class="c0 " x1="11" y1="11" x2="104" y2="104" />
                <line class="c1 " x1="84" y1="24" x2="94" y2="24" />
                <line class="c1 " x1="143" y1="67" x2="153" y2="77" />
                <line class="c1 " x1="134" y1="67" x2="143" y2="67" />
                <line class="c1 " x1="64" y1="137" x2="134" y2="67" />
                <line class="c3 " x1="84" y1="30" x2="94" y2="30" />
                <line class="c3 " x1="35" y1="164" x2="101" y2="98" />
                <line class="c4 " x1="102" y1="97" x2="162" y2="37" />
                <line class="c4 " x1="84" y1="34" x2="94" y2="34" />
                <line class="c5 " x1="84" y1="32" x2="94" y2="32" />
                <line class="c5 " x1="105" y1="105" x2="177" y2="177" />
                <line class="c6 " x1="84" y1="26" x2="94" y2="26" />
                <line class="c6 " x1="138" y1="88" x2="192" y2="142" />
                <line class="c6 " x1="104" y1="99" x2="115" y2="88" />
                <line class="c6 " x1="115" y1="88" x2="138" y2="88" />
                <line class="c7 " x1="107" y1="102" x2="107" y2="103" />
                <line class="c7 " x1="106" y1="104" x2="107" y2="103" />
                <line class="c7 " x1="106" y1="101" x2="107" y2="102" />
                <line class="c8 " x1="84" y1="28" x2="94" y2="28" />
                <line class="c8 " x1="132" y1="39" x2="132" y2="65" />
                <line class="c8 " x1="101" y1="96" x2="132" y2="65" />
                <line class="c9 " x1="105" y1="100" x2="116" y2="89" />
                <line class="c9 " x1="84" y1="36" x2="94" y2="36" />
                <line class="c9 " x1="136" y1="134" x2="142" y2="128" />
                <line class="c9 " x1="142" y1="128" x2="151" y2="128" />
                <line class="c9 " x1="137" y1="89" x2="162" y2="114" />
                <line class="c9 " x1="162" y1="114" x2="162" y2="117" />
                <line class="c9 " x1="151" y1="128" x2="162" y2="117" />
                <line class="c9 " x1="116" y1="89" x2="137" y2="89" />

                <!-- Stations -->
                <use x="11" y="11" href="#wm" /><text x="10.25" y="11" text-anchor="end"
                    transform="rotate(-45 11, 11)">Yanchep</text>
                <use x="17" y="17" href="#wm" /><text x="16.25" y="17" text-anchor="end"
                    transform="rotate(-45 17, 17)">Eglinton</text>
                <use x="23" y="23" href="#wm" /><text x="22.25" y="23" text-anchor="end"
                    transform="rotate(-45 23, 23)">Alkimos</text>
                <use x="29" y="29" href="#wm" /><text x="28.25" y="29" text-anchor="end"
                    transform="rotate(-45 29, 29)">Butler</text>
                <use x="35" y="35" href="#wm" /><text x="34.25" y="35" text-anchor="end"
                    transform="rotate(-45 35, 35)">Clarkson</text>
                <use x="35" y="164" href="#wm" /><text x="34.25" y="164" text-anchor="end"
                    transform="rotate(45 35, 164)">Fremantle</text>
                <use x="39" y="160" href="#wm" /><text x="38.25" y="160" text-anchor="end"
                    transform="rotate(45 39, 160)">North Fremantle</text>
                <use x="41" y="41" href="#wm" /><text x="40.25" y="41" text-anchor="end"
                    transform="rotate(-45 41, 41)">Currambine</text>
                <use x="43" y="156" href="#wm" /><text x="42.25" y="156" text-anchor="end"
                    transform="rotate(45 43, 156)">Victoria Street</text>
                <use x="47" y="47" href="#wm" /><text x="46.25" y="47" text-anchor="end"
                    transform="rotate(-45 47, 47)">Joondalup</text>
                <use x="47" y="152" href="#wm" /><text x="46.25" y="152" text-anchor="end"
                    transform="rotate(45 47, 152)">Mosman Park</text>
                <use x="51" y="148" href="#wm" /><text x="50.25" y="148" text-anchor="end"
                    transform="rotate(45 51, 148)">Cottesloe</text>
                <use x="53" y="53" href="#wm" /><text x="52.25" y="53" text-anchor="end"
                    transform="rotate(-45 53, 53)">Edgewater</text>
                <use x="55" y="144" href="#wm" /><text x="54.25" y="144" text-anchor="end"
                    transform="rotate(45 55, 144)">Grant Street</text>
                <use x="59" y="59" href="#wm" /><text x="58.25" y="59" text-anchor="end"
                    transform="rotate(-45 59, 59)">Whitfords</text>
                <use x="59" y="140" href="#wm" /><text x="58.25" y="140" text-anchor="end"
                    transform="rotate(45 59, 140)">Swanbourne</text>
                <use x="63" y="136" href="#wm" /><text x="62.25" y="136" text-anchor="end"
                    transform="rotate(45 63, 136)">Claremont</text>
                <use x="64" y="137" href="#wm" />

        async function fetchStation(line, station) {
            const url = `/api/TrainLiveTimes/LiveStatus/GetStationLiveStatusAsync/${encodeURIComponent(line)}/${encodeURIComponent(station)}/false`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${station}`);
            return resp.json();
        }

        function updateLoadProgress(line, station, lineIdx, stationIdx, lineNames, stationList) {
            const totalStations = Object.values(LIVE_LINES).reduce((s, l) => s + l.length, 0);
            let done = 0;
            for (let k = 0; k < lineIdx; k++) done += LIVE_LINES[lineNames[k]].length;
            done += stationIdx + 1;
            const pct = Math.round(done / totalStations * 100);
            const el = document.getElementById('timestamp');
            if (el) el.textContent = `Loading ${pct}% — ${line.replace(' Line','')} • ${station.replace(' Stn','')}`;
        }

        async function fetchLiveData() {
            const stations = {};
            let lastUpdated = '';
            const lineNames = Object.keys(LIVE_LINES);

            // Initialize trainData immediately so trains appear as they load
            trainData = { timestamp: 'Loading...', stations: {} };

            for (let i = 0; i < lineNames.length; i++) {
                const line = lineNames[i];
                const stationList = LIVE_LINES[line];

                for (let j = 0; j < stationList.length; j++) {
                    const station = stationList[j];
                    try {
                        const data = await fetchStation(line, station);
                        if (data && data.result === 'success') {
                            stations[station] = data.data;
                            if (data.data.LastUpdated) lastUpdated = data.data.LastUpdated;
                        }
                    } catch (e) {
                        console.warn(`Failed: ${station} — ${e.message}`);
                    }

                    // Update trainData progressively so trains appear immediately
                    trainData.stations = { ...stations };
                    trainData.timestamp = lastUpdated || 'Loading...';
                    stationOrder = Object.keys(trainData.stations);
                    calculateValidTimeRange();
                    buildStationIndex();

                    updateLoadProgress(line, station, i, j, lineNames, stationList);

                    const isLast = (i === lineNames.length - 1 && j === stationList.length - 1);
                    if (!isLast) await sleep(FETCH_DELAY_MS);
                }
                if (i < lineNames.length - 1) await sleep(LINE_DELAY_MS - FETCH_DELAY_MS);
            }

            trainData = {
                timestamp: lastUpdated || new Date().toLocaleString('en-AU'),
                stations: stations
            };
        }

        async function loadJsonFallback() {
            const response = await fetch('live_train_map.json');
            if (!response.ok) throw new Error('Could not load JSON');
            trainData = await response.json();

            if (trainData.trains) {
                const stations = {};
                for (const [trainId, train] of Object.entries(trainData.trains)) {
                    for (const stop of train.stops) {
                        if (!stations[stop.station]) stations[stop.station] = { StatusDetailList: [] };
                        stations[stop.station].StatusDetailList.push({
                            TrainID: train.id, TripId: train.id,
                            LineName: train.line, Destination: train.destination,
                            Departure: stop.time, Platform: train.platform,
                            Ncar: train.ncar, Series: train.series, StatusDetail: train.status
                        });
                    }
                }
                trainData.stations = stations;
            } else if (trainData.lines) {
                const merged = {};
                for (const ld of Object.values(trainData.lines)) Object.assign(merged, ld.stations);
                trainData.stations = merged;
            }
        }

            }
        }

        function setFavoriteFromSelect() {
            const select = document.getElementById('favoriteStationSelect');
            if (select.value) {
                saveFavoriteStation(select.value);
            }
        }

        function updateFavoriteStation() {
            if (!favoriteStation || !trainData) return;

            const stationData = trainData.stations[favoriteStation];
            if (!stationData || !stationData.StatusDetailList) return;

            const currentTime = getCurrentTime();

            // Get all upcoming trains
            const upcomingTrains = stationData.StatusDetailList
                .map(train => {
                    const departureTime = parseTime(train.Departure);
                    const minutesUntil = (departureTime - currentTime) / 1000 / 60;
                    return { ...train, minutesUntil, departureTime };
                })
                .filter(train => train.minutesUntil >= -1) // Include trains up to 1 min past
                .sort((a, b) => a.minutesUntil - b.minutesUntil)
                .slice(0, 3);

            const listContainer = document.getElementById('favoriteTrainsList');
            if (!listContainer) return;

            if (upcomingTrains.length === 0) {
                listContainer.innerHTML = '<div class="favorite-no-trains">No upcoming trains</div>';
                return;
            }

            listContainer.innerHTML = upcomingTrains.map(train => {
                const mins = Math.round(train.minutesUntil);
                let countdownText = '';
                let countdownClass = '';

                if (mins < 0) {
                    countdownText = 'Departing';
                    countdownClass = 'departing';
                } else if (mins === 0) {
                    countdownText = 'Now';
                    countdownClass = 'departing';
                } else if (mins === 1) {
                    countdownText = '1 min';
                    countdownClass = 'soon';
                } else if (mins <= 5) {
                    countdownText = `${mins} mins`;
                    countdownClass = 'soon';
                } else {
                    countdownText = `${mins} mins`;
                }

                return `
            <div class="favorite-train" style="border-left-color: ${lineColors[train.LineName] || '#333'}">
                <div class="favorite-train-info">
                    <div class="favorite-train-time">${formatTime12Hr(train.Departure)}</div>
                    <div class="favorite-train-dest">to ${train.Destination} • Platform ${train.Platform}</div>
                </div>
                <div class="favorite-train-countdown ${countdownClass}">${countdownText}</div>
            </div>
        `;
            }).join('');
        }

        function calculateValidTimeRange() {
            let minTime = null;
            let maxTime = null;

            Object.values(trainData.stations).forEach(stationData => {
                if (!stationData || !stationData.StatusDetailList) return;

                stationData.StatusDetailList.forEach(train => {
                    const time = parseTime(train.Departure);
                    if (!minTime || time < minTime) minTime = time;
                    if (!maxTime || time > maxTime) maxTime = time;
                });
            });

            if (minTime && maxTime) {
                // Add buffer: 30 min before first train, 30 min after last train
                minTime.setMinutes(minTime.getMinutes() - 30);
                maxTime.setMinutes(maxTime.getMinutes() + 30);

                validTimeRange.min = minTime;
                validTimeRange.max = maxTime;

                const minStr = formatTime12Hr(minTime);
                const maxStr = formatTime12Hr(maxTime);

                document.getElementById('debugRange').textContent = `Valid range: ${minStr} - ${maxStr}`;
            }
        }

        function isTimeInValidRange(time) {
            if (!validTimeRange.min || !validTimeRange.max) return true;

            const timeToCheck = new Date(time);
            const checkHours = timeToCheck.getHours();
            const checkMinutes = timeToCheck.getMinutes();

            const minHours = validTimeRange.min.getHours();
            const minMinutes = validTimeRange.min.getMinutes();
            const maxHours = validTimeRange.max.getHours();
            const maxMinutes = validTimeRange.max.getMinutes();

            const checkTotalMinutes = checkHours * 60 + checkMinutes;
            const minTotalMinutes = minHours * 60 + minMinutes;
            const maxTotalMinutes = maxHours * 60 + maxMinutes;

            return checkTotalMinutes >= minTotalMinutes && checkTotalMinutes <= maxTotalMinutes;
        }

        function showDebugError(message) {
            const errorEl = document.getElementById('debugError');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 3000);
        }

        // Convert 24hr time string (HH:MM) or Date object to 12hr format
        function formatTime12Hr(time) {
            let hours, minutes;

            if (typeof time === 'string') {
                // Parse from "HH:MM" string
                [hours, minutes] = time.split(':').map(Number);
            } else if (time instanceof Date) {
                // Extract from Date object
                hours = time.getHours();
                minutes = time.getMinutes();
            } else {
                return time; // Return as-is if unrecognized format
            }

            const period = hours >= 12 ? 'PM' : 'AM';
            const hours12 = hours % 12 || 12; // Convert 0 to 12
            const minutesStr = minutes.toString().padStart(2, '0');

            return `${hours12}:${minutesStr} ${period}`;
        }

        function parseTime(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const now = new Date();
            const time = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);
            return time;
        }

        // NEW: Get all scheduled stops for a train
        function getAllTrainStops(tripId) {
            // Find all scheduled stops for this train across all stations
            const stops = [];

            Object.entries(trainData.stations).forEach(([stationName, stationData]) => {
                if (!stationData || !stationData.StatusDetailList) return;

                const matchingTrain = stationData.StatusDetailList.find(t => t.TripId === tripId);
                if (matchingTrain) {
                    stops.push({
                        station: stationName,
                        time: parseTime(matchingTrain.Departure),
                        departure: matchingTrain.Departure,
                        destination: matchingTrain.Destination
                    });
                }
            });

            // Sort by time
            stops.sort((a, b) => a.time - b.time);
            return stops;
        }

        // UPDATED: Calculate train position with smooth interpolation and centered station stops
        // Helper: Interpolate position along a multi-waypoint path segment
        function interpolateAlongSegment(pathSegment, progress) {
            // Build full point sequence: [start, ...waypoints, end]
            const fromCoords = getStationCoords(pathSegment.from);
            const toCoords = getStationCoords(pathSegment.to);

            if (!fromCoords || !toCoords) {
                return null; // Fallback if coordinates missing
            }

            const points = [
                fromCoords,
                ...pathSegment.waypoints,
                toCoords
            ];

            // If only two points (no waypoints), use simple linear interpolation
            if (points.length === 2) {
                const dx = points[1].x - points[0].x;
                const dy = points[1].y - points[0].y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;

                return {
                    x: points[0].x + dx * progress,
                    y: points[0].y + dy * progress,
                    angle: angle
                };
            }

            // Calculate cumulative distances along path
            const distances = [0];
            let totalDistance = 0;

            for (let i = 1; i < points.length; i++) {
                const dist = Math.sqrt(
                    Math.pow(points[i].x - points[i-1].x, 2) +
                    Math.pow(points[i].y - points[i-1].y, 2)
                );
                totalDistance += dist;
                distances.push(totalDistance);
            }

            // Find which sub-segment the train is on
            const targetDist = progress * totalDistance;

            for (let i = 1; i < points.length; i++) {
                if (targetDist <= distances[i]) {
                    const segStart = distances[i-1];
                    const segLen = distances[i] - segStart;
                    const localProgress = segLen > 0 ? (targetDist - segStart) / segLen : 0;

                    // Calculate position and angle based on current sub-segment
                    const dx = points[i].x - points[i-1].x;
                    const dy = points[i].y - points[i-1].y;
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

                    return {
                        x: points[i-1].x + dx * localProgress,
                        y: points[i-1].y + dy * localProgress,
                        angle: angle
                    };
                }
            }

            // Fallback to end point with angle from last segment
            const lastIdx = points.length - 1;
            const dx = points[lastIdx].x - points[lastIdx-1].x;
            const dy = points[lastIdx].y - points[lastIdx-1].y;
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            return {
                ...points[lastIdx],
                angle: angle
            };
        }

        // Helper: Normalize station names to match linePaths format
        function normalizeStationName(stationName) {
            // Remove " Stn" suffix to match linePaths format
            return stationName.replace(/ Stn$/, '');
        }

        // Helper: Find the path segment for a train moving between two stations
        function findPathSegment(lineName, fromStation, toStation) {
            const linePath = linePaths[lineName];

            // Fallback if line not defined: use direct path
            if (!linePath) {
                return { from: fromStation, to: toStation, waypoints: [] };
            }

            // Normalize station names to match linePaths format (remove " Stn" suffix)
            const normalizedFrom = normalizeStationName(fromStation);
            const normalizedTo = normalizeStationName(toStation);

            // Try to find direct segment (train stops at both stations consecutively)
            let segment = linePath.segments.find(s =>
                s.from === normalizedFrom && s.to === normalizedTo
            );
            if (segment) return segment;

            // Try reverse direction
            segment = linePath.segments.find(s =>
                s.from === normalizedTo && s.to === normalizedFrom
            );
            if (segment) {
                return {
                    from: normalizedFrom,
                    to: normalizedTo,
                    waypoints: [...segment.waypoints].reverse()
                };
            }

            // No direct segment found - train skips intermediate stations
            // Build path by chaining segments (e.g., Whiteman Park → Ballajura → Noranda)
            const chainedPath = findChainedPath(linePath.segments, normalizedFrom, normalizedTo);
            if (chainedPath) {
                return chainedPath;
            }

            // Fallback: direct path with no waypoints
            return { from: normalizedFrom, to: normalizedTo, waypoints: [] };
        }

        // Helper: Build path by chaining segments when train skips intermediate stops
        function findChainedPath(segments, fromStation, toStation) {
            // Follow consecutive segments to build complete path
            const path = [];
            let current = fromStation;
            const visited = new Set();
            const maxDepth = 20;

            while (current !== toStation && path.length < maxDepth) {
                if (visited.has(current)) break;
                visited.add(current);

                const nextSegment = segments.find(s => s.from === current);
                if (!nextSegment) break;

                path.push(nextSegment);
                current = nextSegment.to;
            }

            if (current === toStation && path.length > 0) {
                // Combine all waypoints and intermediate station coordinates
                const allWaypoints = [];

                for (let i = 0; i < path.length; i++) {
                    allWaypoints.push(...path[i].waypoints);

                    // Add intermediate station as waypoint (except destination)
                    if (i < path.length - 1) {
                        const stationCoord = getStationCoords(path[i].to);
                        if (stationCoord) {
                            allWaypoints.push(stationCoord);
                        }
                    }
                }

                return { from: fromStation, to: toStation, waypoints: allWaypoints };
            }

            // Try reverse direction
            path.length = 0;
            current = toStation;
            visited.clear();

            while (current !== fromStation && path.length < maxDepth) {
                if (visited.has(current)) break;
                visited.add(current);

                const nextSegment = segments.find(s => s.from === current);
                if (!nextSegment) break;

                path.push(nextSegment);
                current = nextSegment.to;
            }

            if (current === fromStation && path.length > 0) {
                path.reverse();
                const allWaypoints = [];

                for (let i = 0; i < path.length; i++) {
                    allWaypoints.push(...[...path[i].waypoints].reverse());

                    if (i < path.length - 1) {
                        const stationCoord = getStationCoords(path[i].from);
                        if (stationCoord) {
                            allWaypoints.push(stationCoord);
                        }
                    }
                }

                return { from: fromStation, to: toStation, waypoints: allWaypoints };
            }

            return null;
        }

        function calculateTrainPosition(train, currentTime) {
            // Get all stops for this train
            const allStops = getAllTrainStops(train.TripId);
            if (allStops.length === 0) return null;

            // Find where we are in the journey
            let prevStop = null;
            let nextStop = null;

            for (let i = 0; i < allStops.length; i++) {
                if (currentTime < allStops[i].time) {
                    nextStop = allStops[i];
                    prevStop = i > 0 ? allStops[i - 1] : null;
                    break;
                }
            }

            // If before first stop, show at first station
            if (!prevStop && nextStop) {
                const timeToDeparture = (nextStop.time - currentTime) / 1000 / 60;
                // Only show train up to 10 minutes before departure
                if (timeToDeparture <= 10) {
                    const position = getStationCoords(nextStop.station);
                    // Calculate opacity based on time to departure
                    const opacity = calculateTrainOpacity(timeToDeparture, 10, true);
                    return { ...position, opacity };
                }
                return null;
            }

            // If after last stop, don't show the train
            if (!nextStop) {
                if (allStops.length > 0) {
                    const lastStop = allStops[allStops.length - 1];
                    const timeSinceLast = (currentTime - lastStop.time) / 1000 / 60;
                    // Show for up to 2 minutes after last stop
                    if (timeSinceLast <= 2) {
                        const position = getStationCoords(lastStop.station);
                        // Fade out gradually after arrival
                        const opacity = Math.max(0, 1 - (timeSinceLast / 2));
                        return { ...position, opacity };
                    }
                }
                return null;
            }

            // Interpolate between prevStop and nextStop
            if (prevStop && nextStop) {
                const totalTime = (nextStop.time - prevStop.time) / 1000 / 60; // in minutes
                const elapsedTime = (currentTime - prevStop.time) / 1000 / 60;

                // Calculate raw progress (0 to 1)
                let progress = totalTime > 0 ? Math.min(Math.max(elapsedTime / totalTime, 0), 1) : 0;

                // Add dwell time at stations
                const dwellRatio = 0.15; // Train sits for 15% of journey time at departure station

                if (progress < dwellRatio) {
                    // Dwelling at previous station - return exact station coordinates
                    const position = getStationCoords(prevStop.station);
                    // Fade out if dwelling for too long
                    const dwellTimeMinutes = elapsedTime;
                    const opacity = calculateTrainOpacity(dwellTimeMinutes, totalTime * dwellRatio, false);

                    // Calculate angle for the upcoming segment
                    const pathSegment = findPathSegment(
                        train.LineName,
                        prevStop.station,
                        nextStop.station
                    );
                    const segmentStart = interpolateAlongSegment(pathSegment, 0);
                    const angle = segmentStart ? segmentStart.angle : 0;

                    return { ...position, opacity, angle };
                } else {
                    // Moving between stations
                    // Adjust progress to account for dwell time
                    const adjustedProgress = (progress - dwellRatio) / (1 - dwellRatio);

                    // Get the path segment for this line
                    const pathSegment = findPathSegment(
                        train.LineName,
                        prevStop.station,
                        nextStop.station
                    );

                    // Interpolate along the path (with waypoints if defined)
                    const position = interpolateAlongSegment(pathSegment, adjustedProgress);

                    if (position) {
                        // If very close to next station (within last 1% of journey), snap to it
                        if (adjustedProgress >= 0.99) {
                            const nextPos = getStationCoords(nextStop.station);
                            return { ...nextPos, opacity: 1, angle: position.angle };
                        }

                        return {
                            x: position.x,
                            y: position.y,
                            opacity: 1,
                            angle: position.angle
                        };
                    }
                }
            }

            return null;
        }

        // Calculate opacity for trains sitting at stations
        function calculateTrainOpacity(timeMinutes, totalTime, isBeforeDeparture) {
            if (isBeforeDeparture) {
                // Before first departure: fade in when < 5 minutes away
                if (timeMinutes <= 2) {
                    return 1; // Fully visible in last 2 minutes
                } else if (timeMinutes <= 5) {
                    // Fade in from 0 to 1 between 5 and 2 minutes
                    return (5 - timeMinutes) / 3;
                } else {
                    return 0; // Invisible if more than 5 minutes away
                }
            } else {
                // During dwell: fade out if dwelling too long
                if (totalTime > 5) {
                    // For long dwells, fade out after 2 minutes and fade back in during last 1 minute
                    const fadeOutStart = 2;
                    const fadeInStart = totalTime - 1;
                    
                    if (timeMinutes < fadeOutStart) {
                        return 1; // Visible for first 2 minutes
                    } else if (timeMinutes < fadeOutStart + 1) {
                        // Fade out over 1 minute
                        return 1 - (timeMinutes - fadeOutStart);
                    } else if (timeMinutes < fadeInStart) {
                        return 0; // Invisible during middle of long dwell
                    } else {
                        // Fade back in during last minute
                        return (timeMinutes - fadeInStart);
                    }
                } else {
                    return 1; // Always visible for short dwells
                }
            }
        }

        // UPDATED: Update trains with DOM element reuse
        function updateStats(activeTrains, allTrains) {
            // Update total trains count
            document.getElementById('totalTrains').textContent = activeTrains.size;

            // Count active lines
            const activeLineSet = new Set();
            allTrains.forEach(train => {
                if (train.LineName) {
                    activeLineSet.add(train.LineName);
                }
            });
            document.getElementById('activeLines').textContent = activeLineSet.size;

            // Count on-time vs delayed trains
            let onTimeCount = 0;
            let delayedCount = 0;

            allTrains.forEach(train => {
                const status = (train.StatusDetail || '').toLowerCase();
                if (status.includes('on time') || status.includes('depart')) {
                    onTimeCount++;
                } else if (status.includes('delay') || status.includes('cancel')) {
                    delayedCount++;
                } else {
                    // Default to on-time if status is unclear
                    onTimeCount++;
                }
            });

            document.getElementById('onTimeTrains').textContent = onTimeCount;
            document.getElementById('delayedTrains').textContent = delayedCount;
        }

        let activeLineFilters = new Set(['all']);

        function initializeFilters() {
            const filterButtonsContainer = document.getElementById('filterButtons');

            // Get all unique line names from trainData
            const lineNames = new Set();
            if (trainData && trainData.stations) {
                Object.values(trainData.stations).forEach(stationData => {
                    if (stationData && stationData.StatusDetailList) {
                        stationData.StatusDetailList.forEach(train => {
                            if (train.LineName) {
                                lineNames.add(train.LineName);
                            }
                        });
                    }
                });
            }

            // Create filter button for each line
            const sortedLines = Array.from(lineNames).sort();
            sortedLines.forEach(lineName => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = lineName.replace(' Line', '');
                btn.setAttribute('data-line', lineName);

                // Set the line color as a data attribute
                const lineColor = lineColors[lineName] || '#333';
                btn.setAttribute('data-color', lineColor);
                btn.style.setProperty('--line-color', lineColor);

                btn.addEventListener('click', () => toggleLineFilter(lineName));

                filterButtonsContainer.appendChild(btn);
            });

            // Add click handler for "All Lines" button
            const allBtn = filterButtonsContainer.querySelector('[data-line="all"]');
            if (allBtn) {
                allBtn.addEventListener('click', () => {
                    activeLineFilters.clear();
                    activeLineFilters.add('all');
                    updateFilterButtons();
                    updateTrains();
                });
            }
        }

        function toggleLineFilter(lineName) {
            // If "all" is active, deactivate it and activate this line
            if (activeLineFilters.has('all')) {
                activeLineFilters.clear();
                activeLineFilters.add(lineName);
            } else if (activeLineFilters.has(lineName)) {
                // Deactivate this line
                activeLineFilters.delete(lineName);
                // If no lines active, activate "all"
                if (activeLineFilters.size === 0) {
                    activeLineFilters.add('all');
                }
            } else {
                // Activate this line
                activeLineFilters.add(lineName);
            }

            updateFilterButtons();
            updateTrains();
        }

        function updateFilterButtons() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                const line = btn.getAttribute('data-line');
                if (activeLineFilters.has(line)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function isTrainVisible(train) {
            if (activeLineFilters.has('all')) return true;
            return activeLineFilters.has(train.LineName);
        }

        function getTrainStatus(train) {
            const status = (train.StatusDetail || '').toLowerCase();

            if (status.includes('cancel')) {
                return 'cancelled';
            } else if (status.includes('delay')) {
                return 'delayed';
            } else if (status.includes('on time') || status.includes('depart')) {
                return 'on-time';
            }

            // Default to on-time if unclear
            return 'on-time';
        }

        function shouldShowWarning(train) {
            const status = getTrainStatus(train);
            return status === 'delayed' || status === 'cancelled';
        }

        function updateTrains() {
            if (!trainData || !trainData.stations) return;

            const currentTime = getCurrentTime();
            const trainsGroup = document.getElementById('trains');

            // Collect all unique trains (by TripId)
            const uniqueTrains = new Map();

            Object.entries(trainData.stations).forEach(([stationName, stationData]) => {
                if (!stationData || !stationData.StatusDetailList) return;

                stationData.StatusDetailList.forEach(train => {
                    // Skip trains with invalid TripId
                    if (!train.TripId || train.TripId < 0) return;

                    // Store the first occurrence of each train we find
                    if (!uniqueTrains.has(train.TripId)) {
                        uniqueTrains.set(train.TripId, {
                            ...train,
                            station: stationName
                        });
                    }
                });
            });

            // Get existing train elements
            const existingTrains = new Map();
            trainsGroup.querySelectorAll('.train-marker').forEach(el => {
                const id = el.getAttribute('data-train-id');
                if (id) existingTrains.set(id, el);
            });

            // Count trains that have valid positions (for stats)
            const activeTrains = new Map();
            const allTrainsList = [];

            // Update or create trains
            uniqueTrains.forEach((train, tripId) => {
                const position = calculateTrainPosition(train, currentTime);

                // Track all trains for stats (even if filtered out)
                if (position) {
                    allTrainsList.push(train);
                }

                // Check if train should be visible based on filter
                if (!isTrainVisible(train)) {
                    const existing = existingTrains.get(String(tripId));
                    if (existing) existing.remove();
                    return;
                }

                // Remove train if no position
                if (!position) {
                    const existing = existingTrains.get(String(tripId));
                    if (existing) existing.remove();
                    return;
                }

                // Track active visible trains
                activeTrains.set(tripId, train);

                // Use angle from position calculation (from path tangent)
                let angle = position.angle !== undefined ? position.angle : 0;

                // Determine train properties
                const baseLineColor = lineColors[train.LineName] || '#333';
                const trainStatus = getTrainStatus(train);
                const showWarning = shouldShowWarning(train);

                // Update existing train or create new one
                let trainGroup = existingTrains.get(String(tripId));

                if (trainGroup) {
                    // Update position of existing train smoothly
                    trainGroup.setAttribute('transform', `translate(${position.x}, ${position.y}) rotate(${angle})`);
                    // Update opacity with smooth transition
                    trainGroup.style.opacity = position.opacity !== undefined ? position.opacity : 1;

                    // Update CSS class for animation
                    trainGroup.classList.remove('delayed', 'cancelled');
                    if (trainStatus === 'delayed') {
                        trainGroup.classList.add('delayed');
                    } else if (trainStatus === 'cancelled') {
                        trainGroup.classList.add('cancelled');
                    }

                    // Update warning icons visibility
                    const warnings = trainGroup.querySelectorAll('.train-warning');
                    warnings.forEach(warning => {
                        warning.style.display = showWarning ? 'block' : 'none';
                    });

                    existingTrains.delete(String(tripId)); // Mark as updated
                } else {
                    // Create new train
                    const numCars = parseInt(train.Ncar) || 6;
                    const series = train.Series || 'C';
                    const carsPerRect = carsPerUnit[series] || 6;
                    const numRectangles = Math.max(1, Math.round(numCars / carsPerRect));

                    trainGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    trainGroup.classList.add('train-marker');
                    if (trainStatus === 'delayed') {
                        trainGroup.classList.add('delayed');
                    } else if (trainStatus === 'cancelled') {
                        trainGroup.classList.add('cancelled');
                    }
                    trainGroup.setAttribute('data-train-id', String(tripId));
                    trainGroup.setAttribute('transform', `translate(${position.x}, ${position.y}) rotate(${angle})`);
                    trainGroup.style.opacity = position.opacity !== undefined ? position.opacity : 1;

                    // Calculate offset to center the train at the origin
                    const centerOffset = (numRectangles - 1) * 2.25 + 2;

                    for (let i = 0; i < numRectangles; i++) {
                        const offset = i * 4.5;

                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', -offset - 4 + centerOffset);
                        rect.setAttribute('y', -1);
                        rect.setAttribute('width', '4');
                        rect.setAttribute('height', '2');
                        rect.setAttribute('fill', baseLineColor);
                        rect.setAttribute('rx', '0.3');
                        rect.classList.add('train-car');
                        trainGroup.appendChild(rect);

                        // Add exclamation mark for delayed/cancelled trains
                        if (showWarning) {
                            const warning = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                            warning.setAttribute('x', -offset - 2 + centerOffset);
                            warning.setAttribute('y', 0.3);
                            warning.setAttribute('font-size', '1.5');
                            warning.setAttribute('font-weight', '900');
                            warning.setAttribute('fill', '#fff');
                            warning.setAttribute('text-anchor', 'middle');
                            warning.setAttribute('dominant-baseline', 'middle');
                            warning.classList.add('train-warning');
                            warning.textContent = '!';
                            trainGroup.appendChild(warning);
                        }
                    }

                    trainGroup.addEventListener('mouseenter', (e) => showTrainPopup(e, train));
                    trainGroup.addEventListener('mouseleave', hideTrainPopup);

                    trainsGroup.appendChild(trainGroup);
                }
            });

            // Remove trains that no longer exist
            existingTrains.forEach(el => el.remove());

            // Update statistics display
            updateStats(activeTrains, allTrainsList);
        }

        function getStationCoords(stationName) {
            return stationCoordinates[stationName] ||
                stationCoordinates[stationName.replace(' Stn', '')] ||
                stationCoordinates[stationName + ' Stn'];
        }

        function showTrainPopup(event, train) {
            const popup = document.getElementById('trainPopup');
            const details = [];
            if (train.Ncar) details.push(`${train.Ncar} cars`);
            if (train.Series) details.push(`Series ${train.Series}`);
            if (train.id) details.push(`Train #${train.id}`);

            // Hide station popup when showing train popup
            hideStationPopup();

            const status = getTrainStatus(train);
            let statusBadge = '';
            if (status === 'delayed') {
                statusBadge = '<div class="status-badge delayed-badge">DELAYED</div>';
            } else if (status === 'cancelled') {
                statusBadge = '<div class="status-badge cancelled-badge">CANCELLED</div>';
            }

            popup.innerHTML = `
        <div class="time">${formatTime12Hr(train.Departure)} - Platform ${train.Platform}</div>
        <div class="dest">to ${train.Destination}</div>
        ${details.length > 0 ? `<div class="details">${details.join(' • ')}</div>` : ''}
        <div class="details">${train.StatusDetail}</div>
        ${statusBadge}
    `;

            popup.style.display = 'block';
            popup.style.left = event.pageX + 15 + 'px';
            popup.style.top = event.pageY + 15 + 'px';
        }

        function hideTrainPopup() {
            document.getElementById('trainPopup').style.display = 'none';
        }

        // Station popup functions
        let stationIndex = {};

        function buildStationIndex() {
            stationIndex = {};

            // Works with both station-centric (live API) and train-centric (JSON fallback) formats
            if (trainData.stations) {
                // Station-centric: iterate stations → StatusDetailList
                for (const [stationName, stationData] of Object.entries(trainData.stations)) {
                    if (!stationData || !stationData.StatusDetailList) continue;
                    if (!stationIndex[stationName]) stationIndex[stationName] = [];

                    stationData.StatusDetailList.forEach(train => {
                        stationIndex[stationName].push({
                            ...train,
                            departureTime: train.Departure,
                            LineName: train.LineName,
                            Destination: train.Destination,
                            Platform: train.Platform,
                            Ncar: train.Ncar,
                            Series: train.Series,
                            StatusDetail: train.StatusDetail,
                            Departure: train.Departure
                        });
                    });
                }
            } else if (trainData.trains) {
                // Train-centric: iterate trains → stops
                Object.values(trainData.trains).forEach(train => {
                    if (!train.stops) return;
                    train.stops.forEach(stop => {
                        if (!stationIndex[stop.station]) stationIndex[stop.station] = [];
                        stationIndex[stop.station].push({
                            ...train,
                            departureTime: stop.time,
                            LineName: train.line,
                            Destination: train.destination,
                            Platform: train.platform,
                            Ncar: train.ncar,
                            Series: train.series,
                            StatusDetail: train.status,
                            Departure: stop.time
                        });
                    });
                });
            }
        }

        function getNextTrainsAtStation(stationName, limit = 3) {
            const currentTime = getCurrentTime();
            const trains = stationIndex[stationName] || [];

            return trains
                .map(train => {
                    const departureTime = parseTime(train.departureTime);
                    const minutesUntil = Math.round((departureTime - currentTime) / 60000);
                    return { ...train, minutesUntil, departureTime };
                })
                .filter(t => t.minutesUntil >= -1)
                .sort((a, b) => a.minutesUntil - b.minutesUntil)
                .slice(0, limit);
        }

        function showStationPopup(stationName, event) {
            const popup = document.getElementById('stationPopup');
            const trains = getNextTrainsAtStation(stationName, 3);

            // Hide train popup when showing station popup
            hideTrainPopup();

            let content = `<div class="station-popup-header">${stationName.replace(' Stn', '').toUpperCase()}</div>`;

            if (trains.length === 0) {
                content += '<div class="station-no-trains">No upcoming trains</div>';
            } else {
                trains.forEach(train => {
                    const lineColor = lineColors[train.LineName] || '#333';
                    const status = getTrainStatus(train);
                    let statusBadgeHTML = '';

                    if (status === 'delayed') {
                        statusBadgeHTML = '<div class="status-badge delayed-badge" style="margin-top: 4px; padding: 4px 8px; font-size: 0.7em;">DELAYED</div>';
                    } else if (status === 'cancelled') {
                        statusBadgeHTML = '<div class="status-badge cancelled-badge" style="margin-top: 4px; padding: 4px 8px; font-size: 0.7em;">CANCELLED</div>';
                    }

                    content += `
                        <div class="station-train-item" style="--line-color: ${lineColor}">
                            <div class="station-train-time">${formatTime12Hr(train.departureTime)}</div>
                            <div class="station-train-countdown">in ${train.minutesUntil} min${train.minutesUntil !== 1 ? 's' : ''}</div>
                            <div class="station-train-dest">to ${train.Destination}</div>
                            <div class="station-train-platform">Platform ${train.Platform}</div>
                            ${statusBadgeHTML}
                        </div>
                    `;
                });
            }

            popup.innerHTML = content;
            popup.style.display = 'block';
            popup.style.left = event.pageX + 15 + 'px';
            popup.style.top = event.pageY + 15 + 'px';
        }

        function hideStationPopup() {
            document.getElementById('stationPopup').style.display = 'none';
        }

        function attachStationClickHandlers() {
            // Select all station markers (<use> elements in the SVG)
            const stationMarkers = document.querySelectorAll('svg use[href="#wm"], svg use[href="#wm-xf"]');

            stationMarkers.forEach(marker => {
                // Find the adjacent text element to get station name
                const x = parseFloat(marker.getAttribute('x'));
                const y = parseFloat(marker.getAttribute('y'));

                // Find text element near this position
                const textElements = document.querySelectorAll('svg text');
                let stationName = null;

                for (const textEl of textElements) {
                    const textX = parseFloat(textEl.getAttribute('x'));
                    const textY = parseFloat(textEl.getAttribute('y'));

                    // Text is usually within 2 units of the marker
                    if (Math.abs(textX - x) < 3 && Math.abs(textY - y) < 3) {
                        stationName = textEl.textContent.trim();
                        break;
                    }
                }

                // If we found a station name, attach click handler
                if (stationName) {
                    // Add " Stn" suffix if not already present (to match data format)
                    const normalizedStationName = stationName.endsWith(' Stn') ? stationName : stationName + ' Stn';

                    marker.style.cursor = 'pointer';
                    marker.addEventListener('click', (event) => {
                        event.stopPropagation();
                        showStationPopup(normalizedStationName, event);
                    });
                }
            });
        }

        function togglePlay() {
            if (isPlaying) {
                // Pausing: accumulate the time we've simulated
                const now = performance.now();
                const realElapsed = now - playbackStartTime;
                const simulatedElapsed = realElapsed * playbackSpeed;
                accumulatedPlaybackTime += simulatedElapsed;
                isPlaying = false;
            } else {
                // Starting playback
                playbackStartTime = performance.now();
                isPlaying = true;
            }
            updatePlayButton();
        }

        function updatePlayButton() {
            const btn = document.getElementById('debugPlayBtn');
            if (!btn) return;

            if (isPlaying) {
                btn.textContent = '⏸ Pause';
                btn.classList.add('playing');
            } else {
                btn.textContent = '▶ Play';
                btn.classList.remove('playing');
            }
        }

        function resetToNow() {
            frozenTime = new Date().getTime();
            accumulatedPlaybackTime = 0;
            isPlaying = false;
            updatePlayButton();
            updateDebugDisplay();
        }

        // Make functions available globally for onclick handlers
        window.setFavoriteFromSelect = setFavoriteFromSelect;
        window.clearFavoriteStation = clearFavoriteStation;
        window.togglePlay = togglePlay;
        window.resetToNow = resetToNow;
        window.debugSetTime = debugSetTime;
        window.toggleDebugMenu = toggleDebugMenu;

        // Initialize on page load
        window.addEventListener('load', loadData);

        // Add click-outside handler to close all popups
        document.addEventListener('click', function(event) {
            const trainPopup = document.getElementById('trainPopup');
            const stationPopup = document.getElementById('stationPopup');

            // Check if click is outside both popups
            const isClickInsidePopup = trainPopup.contains(event.target) || stationPopup.contains(event.target);
            const isClickOnStation = event.target.closest('use[href="#wm"], use[href="#wm-xf"]');
            const isClickOnTrain = event.target.closest('.train-marker');

            // Hide station popup if clicking outside (but not if clicking train/station)
            if (!isClickInsidePopup && !isClickOnStation) {
                hideStationPopup();
            }
        });

        // Add slider interaction
        document.addEventListener('DOMContentLoaded', function () {
            const scrubber = document.getElementById('debugScrubber');
            if (scrubber) {
                scrubber.addEventListener('mousedown', function (e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const percentage = Math.max(0, Math.min(1, x / rect.width));

                    if (validTimeRange.min && validTimeRange.max) {
                        const totalMs = validTimeRange.max.getTime() - validTimeRange.min.getTime();
                        const targetTime = new Date(validTimeRange.min.getTime() + (totalMs * percentage));

                        // Set frozen time directly
                        frozenTime = targetTime.getTime();
                        accumulatedPlaybackTime = 0;
                        if (isPlaying) {
                            playbackStartTime = performance.now();
                        }
                        updateDebugDisplay();
                        updateTrains();
                    }
                });
            }
        });

    </script>
</body>
